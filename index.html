<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c13">
  <title>Merci pour les 1 300 € ! — JEvent</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071c13;
      color: #f2fff5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 15%, #205c3866, transparent 65%),
        linear-gradient(160deg, #0d291c, #05110c);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      padding: clamp(36px, 7vw, 72px) clamp(24px, 5vw, 48px);
      text-align: center;
      border: 1px solid #a5efb333;
      border-radius: 32px;
      background: linear-gradient(135deg, #10301ff2, #0a2119f2);
    }

    .event {
      margin: 0 0 28px;
      color: #a5efb3;
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .heart {
      display: block;
      margin-bottom: 16px;
      font-size: 3rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 22px auto 0;
      max-width: 440px;
      color: #c0d6c8;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .total {
      margin: 36px 0;
      padding: 28px 12px;
      border-block: 1px solid #a5efb326;
    }

    .amount {
      display: block;
      color: #bbf7a1;
      font-size: clamp(3.5rem, 13vw, 6.5rem);
      font-weight: 850;
      line-height: 1.2;
      letter-spacing: -0.06em;
      white-space: nowrap;
    }

    .label {
      display: block;
      margin-top: 8px;
      color: #c0d6c8;
      font-size: 0.95rem;
    }

    .closing {
      margin: 0;
      color: #e1f1e6;
      font-size: 1rem;
      line-height: 1.7;
    }

    .closing strong {
      color: #bbf7a1;
    }

    #confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -24px;
      width: 8px;
      height: 13px;
      border-radius: 2px;
      opacity: 0;
      animation: fall var(--duration) linear var(--delay) forwards;
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(0);
      }
      10% {
        opacity: 0.85;
      }
      90% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .confetti {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="confetti" aria-hidden="true"></div>

  <main class="card">
    <p class="event">JEvent 2026</p>

    <span class="heart" aria-hidden="true">💚</span>

    <h1>Un immense merci.</h1>

    <p class="intro">
      Grâce à votre générosité et à votre énergie,
      nous avons récolté ensemble…
    </p>

    <div class="total">
      <strong class="amount">1 300 €</strong>
      <span class="label">Tout pile. Et tout ça, grâce à vous.</span>
    </div>

    <p class="closing">
      Merci aux donateurs, aux streamers et à toutes les personnes
      qui ont fait vivre cet événement.<br>
      <strong>Chaque geste a compté.</strong>
    </p>
  </main>

  <script>
    (() => {
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      if (reducedMotion) return;

      const container = document.getElementById("confetti");
      const colors = ["#bbf7a1", "#66cc99", "#f2d58a", "#effff4"];
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < 45; i++) {
        const confetti = document.createElement("span");

        confetti.className = "confetti";
        confetti.style.left = `${Math.random() * 100}%`;
        confetti.style.background = colors[i % colors.length];
        confetti.style.setProperty(
          "--duration",
          `${4 + Math.random() * 4}s`
        );
        confetti.style.setProperty(
          "--delay",
          `${Math.random() * 2}s`
        );

        fragment.appendChild(confetti);
      }

      container.appendChild(fragment);

      // Une seule pluie de confettis, puis nettoyage.
      window.setTimeout(() => container.remove(), 11000);
    })();
  </script>
</body>
</html>
